name: ci-app
on: [push, pull_request]

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # ---- Python toolchain (backend用)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            fastapi/requirements-dev.txt
            fastapi/requirements.txt

      - name: Install backend dev deps (if any)
        if: ${{ hashFiles('fastapi/requirements-dev.txt') != '' }}
        working-directory: fastapi
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ---- Static quality (backend only if pyproject exists)
      - name: Ruff format (check)
        if: ${{ hashFiles('fastapi/pyproject.toml') != '' }}
        working-directory: fastapi
        run: ruff format --check .

      - name: Ruff check
        if: ${{ hashFiles('fastapi/pyproject.toml') != '' }}
        working-directory: fastapi
        run: ruff check .

      - name: mypy
        if: ${{ hashFiles('fastapi/pyproject.toml') != '' }}
        working-directory: fastapi
        run: mypy .

      # ---- Dependency audit (prod依存のみ・無ければskip)
      - name: Dependency audit (pip-audit)
        if: ${{ hashFiles('fastapi/requirements.txt') != '' }}
        working-directory: fastapi
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # ---- Node toolchain (Reactの場合だけ)
      - name: Setup Node
        if: ${{ hashFiles('streamlit/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: streamlit/package-lock.json

      - name: Frontend build (React)
        if: ${{ hashFiles('streamlit/package.json') != '' }}
        working-directory: streamlit
        run: |
          npm ci
          npm run build

      # ---- Docker / Compose build & smoke
      - uses: docker/setup-buildx-action@v3

      - name: Build images
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: docker compose build

      - name: "Smoke: API (http://localhost:8080/health[|z])"
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: |
          docker compose up -d fastapi || true
          for p in /health /healthz; do
            for i in $(seq 1 10); do
              if curl -fsS "http://localhost:8080${p}" > /dev/null; then
                echo "API OK at ${p}"
                docker compose logs fastapi --tail=50
                exit 0
              fi
              sleep 3
            done
          done
          docker compose logs fastapi
          docker compose down -v || true
          exit 1

      - name: "Smoke: Web (3000 or 8501)"
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: |
          if ! docker compose config --services | grep -q '^streamlit

      - name: Compose down
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: docker compose down -v || true
; then
            echo "No 'streamlit' service -> skip"
            exit 0
          fi
          docker compose up -d streamlit || true
          for port in 3000 8501; do
            for i in $(seq 1 10); do
              if curl -fsS "http://localhost:${port}/" > /dev/null; then
                echo "WEB OK at port ${port}"
                docker compose logs streamlit --tail=50
                docker compose down -v || true
                exit 0
              fi
              sleep 3
            done
          done
          docker compose logs streamlit
          docker compose down -v || true
          exit 1

      - name: Compose down
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: docker compose down -v || true
